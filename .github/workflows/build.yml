name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build
          gradle-version: 8.5

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: symbioteai-jar
          path: build/libs/*.jar
